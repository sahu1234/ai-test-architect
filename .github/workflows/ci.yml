name: AI Test Architect CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_gemini_integration:
        description: 'Run optional Gemini API integration test (requires GEMINI_API_KEY secret)'
        required: false
        default: 'false'

jobs:
  quality-gate:
    name: Typecheck, Unit, Integration & E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      AI_PROVIDER: mock
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client & sync SQLite schema
        run: npx prisma generate && npx prisma db push

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run integration tests (MockAIProvider + real Playwright execution)
        run: npm run test:integration

      - name: Start platform & demo target server for E2E
        run: |
          NODE_ENV=production npx tsx server.ts &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run platform E2E tests
        run: npm run test:e2e

      - name: Stop background server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" || true
          fi

      - name: Upload Playwright reports and execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ci-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gemini-integration:
    name: Optional Gemini Live Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_gemini_integration == 'true'
    env:
      DATABASE_URL: file:./prisma/ci-gemini.db
      AI_PROVIDER: gemini
      GEMINI_MODEL: gemini-4-hydrogen
      RUN_GEMINI_TESTS: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate && npx prisma db push
      - name: Run Gemini integration tests
        run: npx vitest run tests/integration/gemini.optional.test.ts
